<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人台账</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2333;--sub:#6b7280;--line:#e8eaf1;--blue:#2b5cff;--green:#0a9d58;--red:#d64541;--chip:#eef2ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:5}
header b{font-size:16px}
nav{margin-left:auto;display:flex;gap:6px}
nav a{padding:6px 12px;border-radius:16px;text-decoration:none;color:var(--sub);font-size:13px}
nav a.on{background:var(--chip);color:var(--blue);font-weight:600}
main{max-width:1080px;margin:0 auto;padding:14px 16px 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card .l{color:var(--sub);font-size:12px}
.card .v{font-size:20px;font-weight:700;margin-top:4px}
.up{color:var(--green)} .down{color:var(--red)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#fafbfe;color:var(--sub);font-weight:600;font-size:12px}
td:first-child,th:first-child{text-align:left}
tr:last-child td{border-bottom:none}
.btn{border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;background:var(--chip);color:var(--blue)}
.btn.p{background:var(--blue);color:#fff}
.btn.d{background:#fdecec;color:var(--red)}
.btn.sm{padding:4px 8px;font-size:12px}
.toolbar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center}
input,select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--card);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--chip);border-color:var(--blue)}
.dialog{position:fixed;inset:0;background:rgba(20,25,40,.45);display:flex;align-items:center;justify-content:center;z-index:20}
.dialog.hidden{display:none}
.dbox{background:var(--card);border-radius:14px;padding:18px;width:min(480px,92vw);max-height:88vh;overflow:auto}
.dbox h3{margin-bottom:12px}
.field{margin-bottom:10px}
.field label{display:block;color:var(--sub);font-size:12px;margin-bottom:4px}
.field input,.field select{width:100%}
.row{display:flex;gap:10px}.row .field{flex:1}
.muted{color:var(--sub);font-size:12px}
.searchlist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:4px}
.searchlist div{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.searchlist div:hover{background:var(--chip)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--blue);font-size:12px}
svg.spark{width:100%;height:120px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;margin:10px 0}
.kv .k{color:var(--sub)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:30}
.empty{text-align:center;color:var(--sub);padding:40px 0}
</style>
</head>
<body>
<header><b>个人台账</b><span class="muted" id="hdrSub"></span>
  <nav>
    <a href="/" style="background:#eef2ff;color:#2b5cff;font-weight:600">← 理财列表</a>
    <a href="/assets-center" data-r="assets">台账总览</a>
    <a href="/holding-assets" data-r="hold">持仓资产</a>
    <a href="/profit-product" data-r="profit">产品收益</a>
  </nav>
</header>
<main id="app"></main>
<div class="dialog hidden" id="dlg"><div class="dbox" id="dlgBox"></div></div>
<script src="/static/app.js"></script>
</body>
</html>
